onboarding = false

[theme]
# vesper is the closest built-in to the amp palette (near-black bg, warm accent);
# every visible token is overridden below to amp's exact values.
name = "vesper"

# amp palette — same source as ~/.config/nvim/colors/amp.lua, tmux-amp-theme, and i3.
[theme.custom]
panel_bg      = "#0F0F0F"
sidebar_bg    = "#0F0F0F"
surface0      = "#161616"
surface1      = "#1E1E1E"
active_row_bg = "#1E1E1E"
selection_bg  = "#3A2614"
accent        = "#E7894C"
peach         = "#E7894C"
yellow        = "#E3A25A"
red           = "#D9634F"
green         = "#7C9B96"
mauve         = "#B8AFA0"
text          = "#F2ECDD"
subtext0      = "#B8AFA0"
# overlay0/overlay1 are FOREGROUNDS here (inactive tab labels), not borders —
# amp's #262626 border colour is unreadable on #0F0F0F, so both stay in the dim range.
overlay0      = "#8F877A"
overlay1      = "#7A7367"

[ui]
window_title = "{hostname}: {workspace}"
agent_panel_scope = "all"
# group the agents list under its space, and make the space name read as the group header
agent_panel_sort = "spaces"
accent = "#E7894C"

status_indicators = "symbols"

tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  # { type = "text", text = "prod" },
  # { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    "machine",
    { token = "workspace", fg = "#E7894C", bold = true },
    { token = "tab", fg = "#7A7367" },
  ],
  ["agent"],
  [{ token = "$summary", fg = "#89b4fa", bold = true, dim = false }]
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"

[keys]
# tmux-style bindings (prefix is the leader, default ctrl+b)
split_vertical = "prefix+|"
split_horizontal = 'prefix+-'
detach = "prefix+d"

toggle_sidebar = "prefix+b"

new_tab = "alt+n"
next_tab="alt+l"
previous_tab="alt+h"
rename_tab = "prefix+,"

zoom = "ctrl+f"

# focus_pane_left = "ctrl+h"
# focus_pane_down = "ctrl+j"
# focus_pane_up = "ctrl+k"
# focus_pane_right = "ctrl+l"

previous_workspace = "alt+k"
next_workspace = "alt+j"

# leader+s opens the workspace ("spaces") picker (settings moves off prefix+s to make room)
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

# vim-style j/k move the selection up/down inside the spaces picker
# (frees pane up/down in navigate mode; use arrows or ctrl+b j/k for pane focus)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = ""
navigate_pane_down = ""

# next_agent = "alt+j"
# previous_agent = "alt+k"

#### Invalid keys
# leader+a focuses the agent panel for keyboard browsing
# (j/k to move, enter to jump, esc to leave) — needs the rebuilt binary
# agent_picker = "prefix+a"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle review pane"

# popup = session-modal terminal floating over the layout; closes when the
# command exits, and never rearranges the tab's panes.
[[keys.command]]
key = "alt+f"
type = "popup"
command = "~/.config/herdr/scripts/scratch.sh"
description = "scratch terminal (per space, persistent)"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true
