# Amp Theme for Yazi
# Palette: bg #0F0F0F  surface #161616  elevated #1A1A1A  border #262626
#          fg #F2ECDD  muted #B8AFA0  accent #E7894C
#          red #D9634F  blue #6A9FCC  green #7C9B96  cyan #8FC4C4  yellow #E3A25A

# : Manager {{{

[mgr]
cwd = { fg = "#E7894C", bold = true }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#E3A25A", bold = true, italic = true, underline = true }
find_position = { fg = "#E7894C", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#7C9B96", bg = "#7C9B96" }
marker_cut      = { fg = "#D9634F", bg = "#D9634F" }
marker_marked   = { fg = "#6A9FCC", bg = "#6A9FCC" }
marker_selected = { fg = "#E7894C", bg = "#E7894C" }

count_copied   = { fg = "#0F0F0F", bg = "#7C9B96" }
count_cut      = { fg = "#0F0F0F", bg = "#D9634F" }
count_selected = { fg = "#0F0F0F", bg = "#E7894C" }

border_symbol = "│"
border_style  = { fg = "#262626" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#0F0F0F", bg = "#E7894C", bold = true }
inactive = { fg = "#B8AFA0", bg = "#1A1A1A" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#0F0F0F", bg = "#E7894C", bold = true }
normal_alt  = { fg = "#E7894C", bg = "#1A1A1A" }

select_main = { fg = "#0F0F0F", bg = "#6A9FCC", bold = true }
select_alt  = { fg = "#6A9FCC", bg = "#1A1A1A" }

unset_main = { fg = "#0F0F0F", bg = "#B8AFA0", bold = true }
unset_alt  = { fg = "#B8AFA0", bg = "#1A1A1A" }

# : }}}


# : Status bar {{{

[status]
perm_sep   = { fg = "#262626" }
perm_type  = { fg = "#E7894C" }
perm_read  = { fg = "#E3A25A" }
perm_write = { fg = "#D9634F" }
perm_exec  = { fg = "#7C9B96" }

progress_label  = { fg = "#F2ECDD", bold = true }
progress_normal = { fg = "#E7894C", bg = "#262626" }
progress_error  = { fg = "#F2ECDD", bg = "#D9634F" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#E7894C" }
active   = { fg = "#E7894C", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#E7894C" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#E7894C" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#E7894C" }
title   = {}
hovered = { fg = "#E7894C", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#1A1A1A" }
cand            = { fg = "#E7894C" }
rest            = { fg = "#B8AFA0" }
desc            = { fg = "#8FC4C4" }
separator       = "  "
separator_style = { fg = "#262626" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#E7894C" }
run     = { fg = "#6A9FCC" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#0F0F0F", bg = "#F2ECDD" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#E7894C" }
title    = { fg = "#E7894C" }
tbl_col  = { fg = "#6A9FCC" }
tbl_cell = { fg = "#0F0F0F", bg = "#E7894C" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#7C9B96" }
title_warn  = { fg = "#E3A25A" }
title_error = { fg = "#D9634F" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#8FC4C4", bold = true },

	# Media
	{ mime = "{audio,video}/*", fg = "#E7894C", bold = true },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E3A25A", bold = true },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#7C9B96", bold = true },

	# Fallback
	{ url = "*", fg = "#F2ECDD" },
	{ url = "*/", fg = "#E7894C", bold = true },
]

# : }}}
