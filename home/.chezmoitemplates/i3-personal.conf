# Specialized configuration for mpv
# for_window [class="mpv"] floating enable, workspace 0, resize 1058 595, move position 8 1282
# for_window [class="mpv"] resize 1058 595, move position 8 1282
for_window [class="mpv"] resize 1058 595, move position bottom

# switch to workspace with urgent window automatically
for_window [urgent=latest] focus

focus_on_window_activation none

# If there is a pop-up when the window is in fullscreen, do something
popup_during_fullscreen smart

# Quick workspace switching
workspace_auto_back_and_forth yes

# Autostart programs
exec --no-startup-id systemctl --user restart pipewire
exec --no-startup-id systemctl --user import-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
exec --no-startup-id systemctl --user start graphical-session.target
# Fcitx5 starts in ~/.xprofile before i3.
exec --no-startup-id dunst -config $HOME/.config/dunst/dunstrc
exec --no-startup-id xrandr --output DP-0 --primary --output HDMI-0 --auto --rotate left --left-of DP-0
# exec --no-startup-id xrandr --output DP-0 --primary --output HDMI-0 --auto --left-of DP-0
exec_always --no-startup-id handy
exec_always --no-startup-id $HOME/GitHub/i3-alternating-layout/alternating_layouts.py
exec --no-startup-id picom --config $HOME/.config/picom.conf --daemon
exec_always --no-startup-id python3 $HOME/.config/eww/bar.py start
# exec_always --no-startup-id $HOME/.scripts/alacritty_bg_event.py
exec_always --no-startup-id sh $HOME/.fehbg
# exec_always --no-startup-id bash $HOME/.scripts/alacritty_border_poll.sh
# Dynamic picom slide animation for workspace transitions
# exec --no-startup-id python3 $HOME/.scripts/dynamic_picom_slide.py

# Audio controls with progress feedback
bindsym XF86AudioRaiseVolume exec --no-startup-id python3 $HOME/.config/eww/control.py volume up
bindsym XF86AudioLowerVolume exec --no-startup-id python3 $HOME/.config/eww/control.py volume down
bindsym XF86AudioMute exec --no-startup-id python3 $HOME/.config/eww/control.py volume mute

# External-display brightness guidance
bindsym XF86MonBrightnessUp exec --no-startup-id python3 $HOME/.config/eww/control.py brightness up
bindsym XF86MonBrightnessDown exec --no-startup-id python3 $HOME/.config/eww/control.py brightness down

# Media player controls
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# Create Log out, Reboot, Poweroff bindings
mode "Session (L)ock, (R)eboot, (P)oweroff" {
  bindsym $mod+r exec systemctl reboot
  # bindsym $mod+l exit
  bindsym $mod+l exec --no-startup-id /usr/bin/i3lock -c 0f0f0f; mode "default"
  bindsym $mod+p exec systemctl poweroff

  # back to normal: Enter or Escape
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

bindsym $mod+Shift+q mode "Session (L)ock, (R)eboot, (P)oweroff"

# Lock screen settings
bindsym $mod+Shift+x exec --no-startup-id /usr/bin/i3lock -c 0f0f0f

# resize window (you can also use the mouse for that)
mode "resize" {
  # These bindings trigger as soon as you enter the resize mode

  # Pressing left will shrink the window's width.
  # Pressing right will grow the window's width.
  # Pressing up will shrink the window's height.
  # Pressing down will grow the window's height.
  bindsym h resize shrink width 10 px or 10 ppt
  bindsym j resize shrink height 10 px or 10 ppt
  bindsym k resize grow height 10 px or 10 ppt
  bindsym l resize grow width 10 px or 10 ppt

  # same bindings, but for the arrow keys
  bindsym Left resize shrink width 10 px or 10 ppt
  bindsym Up resize grow height 10 px or 10 ppt
  bindsym Down resize shrink height 10 px or 10 ppt
  bindsym Right resize grow width 10 px or 10 ppt

  # back to normal: Enter or Escape
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"

