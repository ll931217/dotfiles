#bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -b 'Yes, exit i3' 'i3-msg exit'"

# Window spacing
gaps inner 6
gaps outer 2
smart_gaps on

# Disables cursor follow
focus_follows_mouse no
# output|none
mouse_warping output

# Press $mod+Shift+g to enter the gap mode. Choose o or i for modifying outer/inner gaps. Press one of + / - (in-/decrement for current workspace) or 0 (remove gaps for current workspace). If you also press Shift with these keys, the change will be global for all workspaces.
set $mode_gaps Gaps: (o) outer, (i) inner
set $mode_gaps_outer Outer Gaps: +|-|0 (local), Shift + +|-|0 (global)
set $mode_gaps_inner Inner Gaps: +|-|0 (local), Shift + +|-|0 (global)
bindsym $mod+Shift+g mode "$mode_gaps"

mode "$mode_gaps" {
  bindsym o      mode "$mode_gaps_outer"
  bindsym i      mode "$mode_gaps_inner"
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

mode "$mode_gaps_inner" {
  bindsym plus  gaps inner current plus 5
  bindsym minus gaps inner current minus 5
  bindsym 0     gaps inner current set 0

  bindsym Shift+plus  gaps inner all plus 5
  bindsym Shift+minus gaps inner all minus 5
  bindsym Shift+0     gaps inner all set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

mode "$mode_gaps_outer" {
  bindsym plus  gaps outer current plus 5
  bindsym minus gaps outer current minus 5
  bindsym 0     gaps outer current set 0

  bindsym Shift+plus  gaps outer all plus 5
  bindsym Shift+minus gaps outer all minus 5
  bindsym Shift+0     gaps outer all set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

for_window [class="^.*"] border pixel 2
default_border pixel 2

# Window rules
for_window [class="^yazi-file-picker$"] floating enable, border pixel 2, resize set 70 ppt 70 ppt, move position center
for_window [class="(?i)^thunar$"] floating enable, border none, move position center
for_window [class="^(com\.mitchellh\.ghostty|ghostty)$"] floating disable, border none

for_window [class="^(winboat)$"] floating enable, border none, move position center
for_window [class="^(pavucontrol)$"] floating enable, border none, move position center
for_window [class="^(pwvucontrol)"] floating enable, border none, move position center

# Browsers
for_window [class="^(zen)$"] border none
for_window [class="^(helium)$"] border none
for_window [class="^(Brave-browser)$"] border none
for_window [class="^(Chromium)$"] border none
for_window [class="^(qutebrowser)$"] border none
for_window [class="^(ChatGPT)$"] move to scratchpad

# Gaming windows
for_window [class="^(steam)"] floating enable, border none, move position center
for_window [class="(?i)^(net[.]lutris[.])?lutris$"] floating enable, border none, move position center
for_window [class="^(itch)$"] floating enable, border none, move position center
for_window [class="^(Picture-in-Picture)$"] floating enable, border none, sticky enable, move position center
for_window [class="^(xwinwrap)$"] floating enable, border none, move position center
for_window [class="^(awakened-poe-trade)$"] floating enable, border none, move position center
for_window [title="^(Path of Exile)$"] floating enable, border none, move position center
for_window [class="^(Emulator)$"] resize 1396 628

no_focus [class="Handy"]
