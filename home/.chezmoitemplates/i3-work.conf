# Work / VDI: opaque windows, native i3 rendering, automatic output placement.
set $mod Mod4
set $term i3-sensible-terminal
font pango:JetBrainsMono Nerd Font 10
floating_modifier $mod

set $bg-color #E7894C
set $inactive-bg-color #262626
set $text-color #F2ECDD
set $inactive-text-color #B8AFA0
set $urgent-bg-color #D9634F

bindsym $mod+Return exec --no-startup-id $term
bindsym $mod+q kill
bindsym $mod+d exec --no-startup-id rofi -show drun
bindsym $mod+Tab exec --no-startup-id rofi -show window
bindsym $mod+b exec --no-startup-id python3 $HOME/.config/eww/control.py toggle
bindsym $mod+n exec --no-startup-id dunstctl history-pop
bindsym $mod+Ctrl+n exec --no-startup-id dunstctl set-paused toggle

# Navigation and layout remain independent of remote-desktop resolution.
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+semicolon focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+semicolon move right
bindsym $mod+Ctrl+h split h
bindsym $mod+Ctrl+v split v
bindsym $mod+t layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+g focus parent

# Generic scratchpads work with any terminal and fit small VDI displays.
# Move any window with Mod+Shift+A; recall with Mod+A or Mod+Ctrl+A.
bindsym $mod+Shift+a move scratchpad
bindsym $mod+a scratchpad show
bindsym $mod+Ctrl+a scratchpad show
for_window [instance=".*-scratchpad$"] floating enable, border pixel 2, resize set 80 ppt 75 ppt, move position center, move scratchpad

# Optional work tools keep their familiar shortcuts without hardcoded paths.
bindsym $mod+s exec --no-startup-id ~/.config/i3/scripts/scratch.sh -c "jd" -a "-e jd"
# i3's PATH has no ~/.cargo/bin, so purple needs its full path.
bindsym $mod+z exec --no-startup-id ~/.config/i3/scripts/scratch.sh -c "purple" -a "-e $HOME/.cargo/bin/purple"
bindsym $mod+x exec --no-startup-id sh -c 'command -v sqlit >/dev/null 2>&1 && i3-sensible-terminal -e sqlit'
bindsym $mod+Shift+s exec --no-startup-id sh -c 'command -v flameshot >/dev/null 2>&1 && flameshot gui'
bindsym $mod+Shift+d exec --no-startup-id sh -c 'command -v rofi-rbw >/dev/null 2>&1 && rofi-rbw'

# switch to workspace
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+0 workspace 10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9
bindsym $mod+Shift+0 move container to workspace 10

# Let i3 and Eww discover outputs; VDI display names and sizes can change.
assign [class="^(zen|Firefox)$"] 9
assign [class="^Google-chrome"] 10
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# Window spacing
gaps inner 6
gaps outer 2
smart_gaps on

# Disables cursor follow
focus_follows_mouse no
# output|none
mouse_warping output

# Press $mod+Shift+g to enter the gap mode. Choose o or i for modifying outer/inner gaps. Press one of + / - (in-/decrement for current workspace) or 0 (remove gaps for current workspace). If you also press Shift with these keys, the change will be global for all workspaces.
set $mode_gaps Gaps: (o) outer, (i) inner
set $mode_gaps_outer Outer Gaps: +|-|0 (local), Shift + +|-|0 (global)
set $mode_gaps_inner Inner Gaps: +|-|0 (local), Shift + +|-|0 (global)
bindsym $mod+Shift+g mode "$mode_gaps"

mode "$mode_gaps" {
  bindsym o      mode "$mode_gaps_outer"
  bindsym i      mode "$mode_gaps_inner"
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

mode "$mode_gaps_inner" {
  bindsym plus  gaps inner current plus 5
  bindsym minus gaps inner current minus 5
  bindsym 0     gaps inner current set 0

  bindsym Shift+plus  gaps inner all plus 5
  bindsym Shift+minus gaps inner all minus 5
  bindsym Shift+0     gaps inner all set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

mode "$mode_gaps_outer" {
  bindsym plus  gaps outer current plus 5
  bindsym minus gaps outer current minus 5
  bindsym 0     gaps outer current set 0

  bindsym Shift+plus  gaps outer all plus 5
  bindsym Shift+minus gaps outer all minus 5
  bindsym Shift+0     gaps outer all set 0

  bindsym Return mode "default"
  bindsym Escape mode "default"
}

default_border pixel 2
default_floating_border pixel 2
for_window [class="(?i)^(thunar|pavucontrol|pwvucontrol)$"] floating enable, move position center
for_window [class="^Picture-in-Picture$"] floating enable, sticky enable, move position center
for_window [urgent=latest] focus
focus_on_window_activation none
popup_during_fullscreen smart
workspace_auto_back_and_forth yes

# Reuse the shared lightweight widgets; do not restart the VDI audio stack.
exec --no-startup-id sh -c 'command -v dbus-update-activation-environment >/dev/null 2>&1 && dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP'
exec --no-startup-id dunst -config $HOME/.config/dunst/dunstrc
exec_always --no-startup-id python3 $HOME/.config/eww/bar.py start

# Audio controls with progress feedback
bindsym XF86AudioRaiseVolume exec --no-startup-id python3 $HOME/.config/eww/control.py volume up
bindsym XF86AudioLowerVolume exec --no-startup-id python3 $HOME/.config/eww/control.py volume down
bindsym XF86AudioMute exec --no-startup-id python3 $HOME/.config/eww/control.py volume mute

# External-display brightness guidance
bindsym XF86MonBrightnessUp exec --no-startup-id python3 $HOME/.config/eww/control.py brightness up
bindsym XF86MonBrightnessDown exec --no-startup-id python3 $HOME/.config/eww/control.py brightness down

# Media player controls
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# Lock the remote X11 session. Session actions require entering this mode first.
bindsym $mod+Shift+x exec --no-startup-id i3lock -c 0f0f0f
bindsym $mod+Shift+q mode "Session: (l) lock, (e) logout, Escape cancel"
bindsym $mod+Shift+e mode "Session: (l) lock, (e) logout, Escape cancel"
mode "Session: (l) lock, (e) logout, Escape cancel" {
  bindsym l exec --no-startup-id i3lock -c 0f0f0f; mode "default"
  bindsym e exit
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# resize window (you can also use the mouse for that)
mode "resize" {
  # These bindings trigger as soon as you enter the resize mode

  # Pressing left will shrink the window’s width.
  # Pressing right will grow the window’s width.
  # Pressing up will shrink the window’s height.
  # Pressing down will grow the window’s height.
  bindsym h resize shrink width 10 px or 10 ppt
  bindsym j resize shrink height 10 px or 10 ppt
  bindsym k resize grow height 10 px or 10 ppt
  bindsym l resize grow width 10 px or 10 ppt

  # same bindings, but for the arrow keys
  bindsym Left resize shrink width 10 px or 10 ppt
  bindsym Up resize grow height 10 px or 10 ppt
  bindsym Down resize shrink height 10 px or 10 ppt
  bindsym Right resize grow width 10 px or 10 ppt

  # back to normal: Enter or Escape
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"

# Amp palette matches the shared launcher, notifications and widgets.
client.focused          $bg-color          $bg-color          #101010              $bg-color          $bg-color
client.focused_inactive $inactive-bg-color $inactive-bg-color $inactive-text-color #262626            #262626
client.unfocused        #161616            #161616            $inactive-text-color #161616            #161616
client.urgent           $urgent-bg-color   $urgent-bg-color   $text-color          $urgent-bg-color   $urgent-bg-color
client.placeholder      #101010            #101010            $text-color          #101010            #101010
client.background       #101010
