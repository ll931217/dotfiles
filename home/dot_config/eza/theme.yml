# Amp Theme for eza
# Palette: bg #0F0F0F  fg #F2ECDD  muted #B8AFA0  accent #E7894C
#          red #D9634F  blue #6A9FCC  green #7C9B96  cyan #8FC4C4  yellow #E3A25A

colourful: true

filekinds:
  normal:     {foreground: "#F2ECDD"}
  directory:  {foreground: "#E7894C", is_bold: true}
  symlink:    {foreground: "#6A9FCC"}
  pipe:       {foreground: "#B8AFA0"}
  block_device: {foreground: "#D9634F", is_bold: true}
  char_device:  {foreground: "#D9634F", is_bold: true}
  socket:     {foreground: "#B8AFA0"}
  special:    {foreground: "#E7894C"}
  executable: {foreground: "#7C9B96", is_bold: true}
  mount_point: {foreground: "#8FC4C4", is_bold: true}

perms:
  user_read:           {foreground: "#F2ECDD", is_bold: true}
  user_write:          {foreground: "#E3A25A", is_bold: true}
  user_execute_file:   {foreground: "#7C9B96", is_bold: true}
  user_execute_other:  {foreground: "#7C9B96", is_bold: true}
  group_read:          {foreground: "#F2ECDD"}
  group_write:         {foreground: "#E3A25A"}
  group_execute:       {foreground: "#7C9B96"}
  other_read:          {foreground: "#B8AFA0"}
  other_write:         {foreground: "#B8AFA0"}
  other_execute:       {foreground: "#B8AFA0"}
  special_user_file:   {foreground: "#E7894C"}
  special_other:       {foreground: "#B8AFA0"}
  attribute:           {foreground: "#B8AFA0"}

size:
  major:                  {foreground: "#B8AFA0"}
  minor:                  {foreground: "#8FC4C4"}
  number_byte:            {foreground: "#F2ECDD"}
  number_kilo:            {foreground: "#F2ECDD"}
  number_mega:            {foreground: "#E3A25A"}
  number_giga:            {foreground: "#E7894C"}
  number_huge:            {foreground: "#D9634F"}
  unit_byte:              {foreground: "#B8AFA0"}
  unit_kilo:              {foreground: "#B8AFA0"}
  unit_mega:              {foreground: "#E3A25A"}
  unit_giga:              {foreground: "#E7894C"}
  unit_huge:              {foreground: "#D9634F"}

users:
  user_you:                {foreground: "#E7894C", is_bold: true}
  user_someone_else:       {foreground: "#B8AFA0"}
  user_root:               {foreground: "#D9634F", is_bold: true}
  group_yours:             {foreground: "#F2ECDD"}
  group_other:             {foreground: "#B8AFA0"}
  group_root:              {foreground: "#D9634F"}

links:
  normal:           {foreground: "#6A9FCC"}
  multi_link_file:  {foreground: "#E3A25A"}

git:
  new:         {foreground: "#7C9B96"}
  modified:    {foreground: "#E3A25A"}
  deleted:     {foreground: "#D9634F"}
  renamed:     {foreground: "#6A9FCC"}
  typechange:  {foreground: "#E7894C"}
  ignored:     {foreground: "#B8AFA0"}
  conflicted:  {foreground: "#D9634F", is_bold: true}

git_repo:
  branch_main:  {foreground: "#F2ECDD"}
  branch_other: {foreground: "#E7894C"}
  git_clean:    {foreground: "#7C9B96"}
  git_dirty:    {foreground: "#E3A25A"}

security_context:
  colon:        {foreground: "#B8AFA0"}
  user:         {foreground: "#F2ECDD"}
  role:         {foreground: "#6A9FCC"}
  typ:          {foreground: "#8FC4C4"}
  range:        {foreground: "#E3A25A"}

file_type:
  image:        {foreground: "#8FC4C4"}
  video:        {foreground: "#E7894C"}
  music:        {foreground: "#7C9B96"}
  lossless:     {foreground: "#7C9B96", is_bold: true}
  crypto:       {foreground: "#D9634F"}
  document:     {foreground: "#F2ECDD"}
  compressed:   {foreground: "#E3A25A"}
  temp:         {foreground: "#B8AFA0"}
  compiled:     {foreground: "#6A9FCC"}
  build:        {foreground: "#E7894C", is_bold: true}
  source:       {foreground: "#F2ECDD"}

punctuation:    {foreground: "#B8AFA0"}
date:           {foreground: "#E3A25A"}
inode:          {foreground: "#B8AFA0"}
blocks:         {foreground: "#B8AFA0"}
header:         {foreground: "#E7894C", is_bold: true, is_underline: true}
octal:          {foreground: "#8FC4C4"}
flags:          {foreground: "#6A9FCC"}

symlink_path:           {foreground: "#6A9FCC"}
control_char:           {foreground: "#D9634F"}
broken_symlink:         {foreground: "#D9634F", is_bold: true}
broken_path_overlay:    {foreground: "#D9634F", is_underline: true}
