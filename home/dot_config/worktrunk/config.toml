# Worktrunk hooks for Zellij integration
# tmux backup: ~/.config/worktrunk/config.toml.tmux-backup

worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
# command = "llm"
# args = ["-m", "claude-haiku-4.5"]

# Open a new Zellij tab for the worktree and start claude
# Runs in background (post-start) so blocking project hooks complete first
[post-start]
zellij = """if [ -n "$ZELLIJ" ]; then \
  zellij action new-tab --name "{{ branch }}" --cwd "{{ worktree_path }}" && \
  sleep 0.3 && \
  zellij action write-chars "claude" && \
  zellij action write-chars $'\\n'; \
fi"""

# Zellij has no CLI to close a tab by name — close manually or use Ctrl+w
[pre-remove]
zellij = "true"
