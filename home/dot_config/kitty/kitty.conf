# vim:fileencoding=utf-8:foldmethod=marker

term xterm-256color

# Fonts
font_size           10.0
font_family       FiraCode Nerd Font
bold_font         FiraCode Nerd Font
italic_font       FiraCode Nerd Font
bold_italic_font  FiraCode Nerd Font
# font_family         JetBrainsMonoNL Nerd Font
# bold_font           JetBrainsMonoNL Nerd Font
# italic_font         JetBrainsMonoNL Nerd Font
# bold_italic_font    JetBrainsMonoNL Nerd Font
symbol_map        U+1FBF0,U+1FBF1,U+1FBF2,U+1FBF3,U+1FBF4,U+1FBF5,U+1FBF6,U+1FBF7,U+1FBF8,U+1FBF9 Iosevka Nerd Font Mono

kitty_mod alt+shift

scrollback_lines 10000
touch_scroll_multiplier 2.0
copy_on_select yes
enable_audio_bell no
# enable_layouts Splits,Stack
hide_window_decorations yes

# Scrollback configuration
# scrollback_pager nvim +"source /home/liangshih.lin/.config/kitty/vi-mode.lua"
# map alt+shift+v show_scrollback
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /home/liangshih.lin/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map kitty_mod+v kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

window_padding_width 0
background_opacity 1.0
background_blur 0

include ~/.config/kitty/themes/mocha.conf

# vim:ft=kitty
