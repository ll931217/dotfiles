# Alacritty Focus Highlight Configuration

[colors]
# Base background color (restored when unfocused)
base = "#101010"

# Highlight color when focused (slate)
highlight = "#181a1f"

[highlight]
# Percentage to brighten the background when focused (0.0 to 1.0)
# Only used if colors.highlight is not set
brightness_percentage = 0.15
